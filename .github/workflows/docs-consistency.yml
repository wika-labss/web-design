name: docs-consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation consistency
        run: python3 scripts/validate_docs.py
      - name: Unit tests
        run: python3 -m unittest tests.test_validate_docs
